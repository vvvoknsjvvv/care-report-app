<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>利用者編集 - CareReport</title>
    <link rel="stylesheet" href="/css/care_report_style.css">
</head>

<body>
    <div class="container">
        <a th:href="@{/patient_list}" class="back-link">＜ 利用者一覧に戻る</a>
        <header>
            <h1>利用者情報の編集</h1>
        </header>

        <form action="/update_patient" method="POST">

            <!--  隠しフィールドでIDを送信 -->
            <input type="hidden" name="id" th:value="${patient.id}">

            <div class="form-group">
                <label for="patient_name">利用者氏名</label>
                <!-- th:value で既存の名前をセット -->
                <input type="text" id="patient_name" name="patient_name" th:value="${patient.patientName}" required>
            </div>

            <div class="form-group">
                <label for="birth_date">生年月日</label>
                <!-- th:value で既存の生年月日をセット -->
                <input type="date" id="birth_date" name="birth_date" th:value="${patient.birthDate}" required>
            </div>

            <div class="form-group">
                <label>要介護度</label>
                <select name="care_level" required>
                    <!-- th:selected で、既存の介護度と一致するものを最初から選択 -->
                    <option value="">選択してください</option>
                    <option value="自立" th:selected="${patient.careLevel == '自立'}">自立</option>
                    <option value="要支援1" th:selected="${patient.careLevel == '要支援1'}">要支援1</option>
                    <option value="要支援2" th:selected="${patient.careLevel == '要支援2'}">要支援2</option>
                    <option value="要介護1" th:selected="${patient.careLevel == '要介護1'}">要介護1</option>
                    <option value="要介護2" th:selected="${patient.careLevel == '要介護2'}">要介護2</option>
                    <option value="要介護3" th:selected="${patient.careLevel == '要介護3'}">要介護3</option>
                    <option value="要介護4" th:selected="${patient.careLevel == '要介護4'}">要介護4</option>
                    <option value="要介護5" th:selected="${patient.careLevel == '要介護5'}">要介護5</option>
                </select>
            </div>

            <div class="form-group">
                <label for="medical_history">既往歴</label>
                <textarea id="medical_history" name="medical_history" style="height: 80px;"
                    th:text="${patient.medicalHistory}"></textarea>
            </div>

            <div class="form-group">
                <label for="emergency_contact">緊急連絡先</label>
                <textarea id="emergency_contact" name="emergency_contact" style="height: 80px;"
                    th:text="${patient.emergencyContact}"></textarea>
            </div>
            <button type="submit" class="submit-btn" style="background-color: #2ecc71;">更新する</button>
        </form>

    </div>



</body>

</html>
