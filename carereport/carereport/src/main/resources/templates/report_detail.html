<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>報告書詳細 - CareReport</title>
    <link rel="stylesheet" href="/css/care_report_style.css">
</head>

<body>
    <div class="container">
        <a th:href="@{/report_list}" class="back-link">＜ 報告書一覧に戻る</a>
        <header>
            <h1>事故・ヒヤリハット詳細</h1>
        </header>

        <div class="detail-group">
            <div class="detail-label">対象利用者</div>
            <div class="detail-value"
                th:text="|${report.patientName} (${patient != null ? patient.careLevel : '情報なし'})|">山田 太郎 (要介護3)</div>
        </div>

        <div class="detail-group">
            <div class="detail-label">発生日時</div>
            <!-- 日付を「〇年〇月〇日 〇:〇」の形式にフォーマット -->
            <div class="detail-value" th:text="${#temporals.format(report.incidentDate, 'yyyy年MM月dd日 HH:mm')}">
                2026年08月18日 10:00</div>
        </div>

        <div class="detail-group">
            <div class="detail-label">発生場所 / カテゴリー</div>
            <div class="detail-value" th:text="|${report.locationName} / ${report.categoryName}|">居室 / 転倒・転落</div>
        </div>

        <div class="detail-group">
            <div class="detail-label">医療的対応</div>
            <!-- フラグが1なら「あり（処置内容）」、0なら「なし」を表示する条件分岐 -->
            <div class="detail-value"
                th:text="${report.medicalActionFlag == 1 ? 'あり（' + report.medicalAction + '）' : 'なし'}">
                あり（絆創膏貼付、バイタル異常なし）</div>
        </div>

        <div class="detail-group">
            <div class="detail-label">事故の発生状況</div>
            <div class="detail-value" th:text="${report.situationDesc}">ベッドから車椅子への移乗時、足がもつれて尻餅をついた。</div>
        </div>

        <div class="detail-group">
            <div class="detail-label">事故発生時の対応</div>
            <div class="detail-value" th:text="${report.responseDesc}">対応内容</div>
        </div>

        <div class="detail-group">
            <div class="detail-label">事故発生後の利用者の状況</div>
            <div class="detail-value" th:text="${report.patientCondition}">その後の状況</div>
        </div>

    </div>
</body>

</html>
