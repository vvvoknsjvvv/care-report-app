<!DOCTYPE html>
<html lang="ja" xmlns:th="[http://www.thymeleaf.org](http://www.thymeleaf.org)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - CareReport</title>
    <link rel="stylesheet" href="/css/care_report_style.css">
</head>

<body>
    <div class="container login-container">
        <div class="app-logo">CareReport</div>
        <div class="app-subtitle">介護事故・ヒヤリハット報告システム</div>

        <div th:if="${param.error}"
            style="color: #e74c3c; background-color: #fadbd8; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
            IDまたはパスワードが間違っています。
        </div>

        <div th:if="${param.logout}"
            style="color: #27ae60; background-color: #d5f5e3; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
            ログアウトしました。
        </div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">ログインID</label>
                <input type="text" id="username" name="username" placeholder="IDを入力" required>
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" placeholder="パスワードを入力" required>
            </div>

            <button type="submit" class="submit-btn">ログイン</button>
        </form>

        <div style="margin-top: 20px; font-size: 0.9rem; color: #7f8c8d; text-align: center;">
            <p>【テスト用アカウント】</p>
            <p>管理者権限 ID: <b>admin</b> / Pass: <b>admin123</b></p>
            <p>一般権限 ID: <b>staff</b> / Pass: <b>staff123</b></p>
        </div>
    </div>
</body>

</html>
