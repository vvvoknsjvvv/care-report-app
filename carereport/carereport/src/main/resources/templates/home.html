<!DOCTYPE html>
<html lang="ja" xmlns:th="[http://www.thymeleaf.org](http://www.thymeleaf.org)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム - CareReport</title>
    <link rel="stylesheet" href="/css/care_report_style.css">
</head>

<body>
    <div class="container">
        <div class="nav-header">
            <h2>介護事故報告システム</h2>

            <div sec:authorize="isAuthenticated()" style="font-size: 1.1rem;">
                ようこそ、 <span th:text="${staff_name}" style="font-weight: bold; color: #0056b3;">staff_user</span> 様
            </div>
        </div>

        <div class="menu-grid">
            <a th:href="@{/care_report}" class="menu-btn">新規報告書</a>
            <a th:href="@{/prevention_list}" class="menu-btn preventive">事後対応・再発防止策</a>
            <a th:href="@{/report_list}" class="menu-btn warning">報告書一覧</a>
            <a th:href="@{/patient_list}" class="menu-btn success">利用者一覧</a>
            <a th:href="@{/add_patient}" class="menu-btn secondary" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">利用者追加</a>
        </div>

        <div class="dashboard-section">
            <div class="dashboard-title">直近の報告一覧</div>
            <a th:href="@{/report_detail(id=${report.id})}" class="report-list-item" th:each="report : ${recentReports}">
                <div>
                    <!-- 日時を表示 -->
                    <th:block th:text="${#temporals.format(report.incidentDate, 'yyyy/MM/dd HH:mm')}">2026/08/18 10:00
                    </th:block>
                    <!-- 完了チェックが false または null の場合に赤字で未完了 -->
                    <span th:if="${report.completeCheck == null or !report.completeCheck}"
                        style="color: red; font-weight: bold; border: 1px solid red; padding: 2px 5px; border-radius: 3px; font-size: 0.8rem; margin-left: 10px;">
                        未完了
                    </span>
                    <br>
                    <!-- 名前と事故種別を表示 -->
                    <small th:text="|${report.patientName} / ${report.categoryName}|">山田 太郎 / 転倒・転落</small>
                </div>
            </a>
        </div>

        <div class="menu-grid">
            <form th:action="@{/logout}" method="POST">
                <button type="submit" class="menu-btn logout" onclick="if(!confirm('本当にログアウトしますか？')){return false;}">
                    ログアウト
                </button>
            </form>
        </div>
    </div>
</body>

</html>
