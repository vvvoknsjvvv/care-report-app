<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>事後対応 報告書リスト</title>
    <link rel="stylesheet" href="/css/care_report_style.css">

</head>

<body>
    <div class="container">
        <a th:href="@{/home}" class="back-link">＜ ホームに戻る</a>
        <header>
            <h1>事後対応・再発防止策 対象リスト</h1>
        </header>

        <!-- カード一覧表示エリア -->

        <div th:each="report : ${reports}" class="list-card"
            th:if="${report.completeCheck != true or #authorization.expression('hasRole(''ADMIN'')')}">
        
            <div class="list-header">
                <span th:text="|発生日: ${#temporals.format(report.incidentDate, 'yyyy/MM/dd HH:mm')}|"></span>
                <span th:text="|対応職員 :    ${report.builderName != null ? report.builderName : '不明'}|"></span>
            </div>
            <div class="list-title" th:text="|${report.patientName} 様 (${report.locationName!= null ? report.locationName : '不明'}, ${report.categoryName != null ? report.categoryName : '不明'})|"></div>
            <div th:text="|発生状況: ${report.situationDesc}|" style="margin-top: 5px; color: #555; font-size: 0.95rem;"></div>
        
            <div class="list-actions">
            
                <!-- 管理者（ADMIN）または、ログイン中IDと報告書の作成者IDが一致する場合のみボタンを表示 -->
                <a th:href="@{/add_prevention(id=${report.id})}" class="btn-sm" style="background-color: #dc3545;"
                    th:if="${#authorization.expression('hasRole(''ADMIN'')') or (report.createdByUser != null and report.createdByUser.loginId == #authentication.name)}">
                    入力
                </a>
            
                <!-- ② それ以外（権限がない一般スタッフ）にはボタンの代わりに文字を表示 -->
                <span
                    th:unless="${#authorization.expression('hasRole(''ADMIN'')') or (report.createdByUser != null and report.createdByUser.loginId == #authentication.name)}"
                    style="color: #dc3545; font-size: 0.85rem;">
                </span>
            
            </div>
        </div>
    </div>
</body>

</html>
